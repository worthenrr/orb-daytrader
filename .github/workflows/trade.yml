name: ORB day trader
on:
  schedule:
    - cron: "7 13 * * 1-5"
    - cron: "7 14 * * 1-5"
    - cron: "10 16 * * 1-5"
    - cron: "10 17 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, flatten, status or backtest"
        default: "status"
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ALPACA_PAPER: "true"
      ACCOUNT_BUDGET: "400"
      MODE: ${{ github.event.inputs.mode }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          if [ "$MODE" = "" ]; then
            case "$SCHEDULE" in
              "10 16 * * 1-5"|"10 17 * * 1-5") MODE=flatten ;;
              *) MODE=run ;;
            esac
          fi
          echo "Mode: $MODE"
          case "$MODE" in
            run) python bot.py ;;
            flatten) python bot.py --flatten ;;
            status) python bot.py --status ;;
            backtest) python backtest.py --days 120 ;;
          esac
