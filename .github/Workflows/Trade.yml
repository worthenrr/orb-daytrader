name: ORB day trader

on:
  schedule:
    # GitHub cron runs on UTC. Two start times cover both daylight saving
    # (13:07 UTC = 9:07 ET) and standard time (14:07 UTC = 9:07 ET). The
    # wrong one for the season exits within seconds.
    - cron: "7 13 * * 1-5"
    - cron: "7 14 * * 1-5"
    # Backup "sell everything the bot holds" runs, in case the main run died.
    - cron: "10 16 * * 1-5"
    - cron: "10 17 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, flatten, status or backtest"
        default: status

concurrency:
  group: orb-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Settings you can change without touching code: repo Settings >
      # Secrets and variables > Actions > Variables.
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      LIVE_TRADING_CONFIRM: ${{ vars.LIVE_TRADING_CONFIRM }}
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
      ACCOUNT_BUDGET: ${{ vars.ACCOUNT_BUDGET || '400' }}
      WATCHLIST: ${{ vars.WATCHLIST || 'INTC,CCJ,MP,UEC,UUUU,USAR,SAIL,LEU' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 16 * * 1-5" ] || [ "${{ github.event.schedule }}" = "10 17 * * 1-5" ]; then
            echo "mode=flatten" >> "$GITHUB_OUTPUT"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            run)      python bot.py ;;
            flatten)  python bot.py --flatten ;;
            status)   python bot.py --status ;;
            backtest) python backtest.py --days 120 ;;
          esac
      - name: Save backtest results
        if: steps.mode.outputs.mode == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: backtest_trades.csv
          if-no-files-found: ignore
